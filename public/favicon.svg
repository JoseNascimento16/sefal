<!--
    O ícone do SEFAL: a gota do mapa (a fiscalização acontece num PONTO da
    cidade) sobre o navy institucional, com a base amarela do calçamento.

    É a MESMA arte do aplicativo do fiscal (`public/pwa-icone.svg` na superfície
    dele): as duas pontas do sistema aparecem com o mesmo rosto na aba do
    navegador. Até 10/09/2026 aqui estava o logo do LARAVEL, que vem no
    starter-kit — ninguém tinha trocado, e a Retaguarda se apresentava como
    "aplicação Laravel" em toda aba aberta.

    Desenho em 192×192 com `rx` de 42 porque é o mesmo quadro do ícone
    instalável do aplicativo; em 16px o que sobrevive é a silhueta da gota, e é
    por isso que ela é grande e maciça no lugar de um brasão detalhado (o brasão
    da Prefeitura vive no cabeçalho da tela, onde há espaço para ele ser lido).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="SEFAL">
    <rect width="192" height="192" rx="42" fill="#14477e"/>
    <path d="M96 34c-21 0-38 17-38 38 0 28 30 60 36 66a3 3 0 0 0 4 0c6-6 36-38 36-66 0-21-17-38-38-38Z" fill="#f4a300"/>
    <circle cx="96" cy="71" r="15" fill="#14477e"/>
    <path d="M52 150h88" stroke="#f4a300" stroke-width="10" stroke-linecap="round"/>
</svg>
