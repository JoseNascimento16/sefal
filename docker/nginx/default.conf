# Nginx -> php-fpm (serviço `app` do docker-compose.homolog.yml). Document root = public/ do Laravel.
#
# ⚠️ Usado APENAS pela rota alternativa de homologação em servidor Docker do cliente (ver o
#    docker-compose.homolog.yml, hoje NÃO ATIVO). No OKD não há Nginx: a imagem S2I sobe Apache com
#    mod_php e o document root vem da env `DOCUMENTROOT=/public`.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Comporta o maior envio do app (fotos de vistoria). Abaixo disso o Nginx devolve 413 ANTES de o
    # Laravel validar — e a mensagem que o usuário vê deixa de ser a do sistema. Mantenha em sincronia
    # com o `post_max_size` do PHP (ver os limites gravados no dockerfile_redhat).
    client_max_body_size 48m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # `app` é o nome do serviço PHP-FPM no compose; 9000 é a porta do php-fpm.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # SCRIPT_FILENAME usa o caminho válido DENTRO do container app (php-fpm), não do Nginx.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloqueia dotfiles (exceto .well-known) — o `.env` fica fora do public/, mas a regra é a rede de
    # segurança para qualquer arquivo oculto que caia ali.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
