# Espelho: GitLab da Fábrica  ──►  GitLab de homologação do cliente (COGEL)
#
# ── Por que ESPELHO, e por que no modelo PULL ───────────────────────────────
# O OKD do cliente só builda a partir do GitLab interno dele
# (repositoriosemit.salvador.ba.gov.br). E a rede interna do cliente NÃO é
# alcançável de fora — então não existe "empurrar de lá para cá": é o runner do
# cliente que CLONA a origem e força o push para dentro. Por isso este arquivo
# vive aqui (na branch espelhada) e roda LÁ.
#
# ⚠️ Este arquivo tem de existir na PRÓPRIA branch espelhada. Se ele só
# existisse configurado na interface do GitLab, o force-push do espelho o
# reverteria no primeiro ciclo.
#
# ── Variáveis (Settings → CI/CD → Variables, no projeto do CLIENTE) ────────
#   FABRICA_TOKEN  — token de LEITURA do projeto na Fábrica (Project Access Token
#                    com `read_repository`, ou Personal Access Token se a instância
#                    for antiga e não tiver o de projeto). Vai como senha do usuário
#                    `oauth2`, que é o que o GitLab aceita para token de acesso.
#   GITLAB_USER    — usuário do token do cliente.
#   GITLAB_TOKEN   — Project Access Token do projeto no cliente, Maintainer +
#                    `write_repository`. ⚠️ Deploy Token dessa instância NÃO tem
#                    write_repository — o push volta 403 e parece problema de
#                    branch protegida.
# Marque as três como Masked; não as escreva neste arquivo.
stages:
  - espelho

espelhar-do-gitlab-da-fabrica:
  stage: espelho
  tags:
    # Sem tag casando, o job fica "stuck" para sempre. Os runners desta
    # instância são `smed` (o que usamos) e `portal-educacao`.
    - smed
  image:
    name: alpine/git:latest
    # A imagem tem `git` como entrypoint; zerar para o GitLab rodar o script
    # via shell em vez de passá-lo como argumento do git.
    entrypoint: ['']
  rules:
    # Só agendado ou manual — nunca em push, senão o espelho dispara a si mesmo.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    # Não precisa do checkout deste repositório: quem é clonado é a origem.
    GIT_STRATEGY: none
  script:
    - git clone --mirror "https://oauth2:${FABRICA_TOKEN}@gitlab.softwell.com.br/jose.nascimento/fiscalizacao-permissionarios.git" origem.git
    - cd origem.git
    # `postBuffer` grande: o proxy do cliente engasga no push em chunked e o
    # comando fica em silêncio por minutos. Não é travamento — é processamento.
    - git config http.postBuffer 524288000
    - git push "https://${GITLAB_USER}:${GITLAB_TOKEN}@repositoriosemit.salvador.ba.gov.br/jose.nascimento/sefal.git" "+refs/heads/homolog:refs/heads/homolog"
